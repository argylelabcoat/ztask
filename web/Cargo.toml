[package]
name = "ztask-web"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
askama = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
zenoh = "=1.9.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
